# 应用的配置，见 Tenon 文档的 configuration.md。开发时 tenon dev 再叠加 .tenon/dev.yaml：其中是前端开发服务器的地址。
# ${VAR:-默认值} 读取环境变量，生产环境用环境变量覆盖开发时的默认值；本机的覆盖写在 config/local.yaml，不提交。
http:
  addr: ":8081"
  # 全局的请求体上限，要比 filesystem.max_upload_size 大一些，上传文件才能通过；JSON 接口另有 Huma 的 1 MiB 上限，不受影响。
  body_limit:
    max_bytes: 21495808 # 20.5 MiB

# 应用对外的地址：生成工作区的地址、聊天插件的嵌入代码等链接时使用。
public_url: ${PUBLIC_URL:-http://localhost:8081}

database:
  dsn: ${DATABASE_URL:-postgres://agents_desk:agents_desk@127.0.0.1:15432/agents_desk?sslmode=disable}

nats:
  url: ${NATS_URL:-nats://127.0.0.1:14222}

queue:
  stream: agents_desk_jobs

# 应用密钥：32 字节随机数的 base64（openssl rand -base64 32），必填：生产环境用环境变量 APP_KEY，本机写在 config/local.yaml。
# 它派生登录验证码的密钥，以后也用于加密和签名链接。
crypt:
  key: ${APP_KEY}

# 平台管理员的登录有效期
admin_token:
  lifetime: 12h
  idle_timeout: 2h
# 坐席每天都在工作区端工作，登录保持得更久：最长 30 天，7 天没有使用就失效。
member_token:
  lifetime: 720h
  idle_timeout: 168h

# 上传的文件（头像等）。默认存在本地目录 storage/files，由应用在 /storage/ 下提供访问；多台服务器或需要 CDN 时
# 改用 S3：配置 disks.s3，并把 default_disk 改为 s3，见 Tenon 文档的 libraries/filesystem.md。
filesystem:
  default_disk: ${FILES_DISK:-local}
  max_upload_size: 20MiB
  disks:
    local:
      root: ${FILES_ROOT:-storage/files}
      public_url: /storage
