# 应用的配置，见 Tenon 文档的 configuration.md。开发时 tenon dev 再叠加 .tenon/dev.yaml：其中是前端开发服务器的地址。
# ${VAR:-默认值} 读取环境变量，生产环境用环境变量覆盖开发时的默认值；本机的覆盖写在 config/local.yaml，不提交。
http:
  addr: ":8080"

# 应用对外的地址：生成工作区的地址、插件的嵌入代码等链接时使用。
public_url: ${PUBLIC_URL:-http://localhost:8080}

database:
  dsn: ${DATABASE_URL:-postgres://agents_desk:agents_desk@127.0.0.1:15432/agents_desk?sslmode=disable}

nats:
  url: ${NATS_URL:-nats://127.0.0.1:14222}

queue:
  stream: agents_desk_jobs

# 应用密钥：32 字节随机数的 base64（openssl rand -base64 32），必填：生产环境用 APP_KEY，本机写在 config/local.yaml。
# 它派生登录验证码的密钥，以后也用于加密和签名链接。
crypt:
  key: ${APP_KEY:-}

# 平台管理员的登录有效期
admin_token:
  lifetime: 12h
  idle_timeout: 2h
