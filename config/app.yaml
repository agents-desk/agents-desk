# 应用的配置，见 Tenon 文档的 configuration.md。开发时 tenon dev 再叠加 .tenon/dev.yaml：其中是前端开发服务器的地址。
# ${VAR:-默认值} 读取环境变量，生产环境用环境变量覆盖开发时的默认值；本机的覆盖写在 config/local.yaml，不提交。
http:
  addr: ":8081"
  # 应用对外的地址：生成工作区的地址、聊天插件的嵌入代码等链接时使用。
  public_url: ${APP_URL:-http://localhost:8081}

# 日志级别默认 info；输出到终端时为文本格式，写入容器或文件时为 JSON。
logs:
  level: ${LOG_LEVEL:-info}

# 可观测性（OpenObserve / OpenTelemetry）：endpoint 与 browser 留空时不推送；填写后前后端自动生效。
telemetry:
  service: agents-desk
  endpoint: ${OTLP_ENDPOINT:-}
  version: ${APP_VERSION:-}
  # 推送到 OpenObserve 时按需取消注释并填写（生产配置写在 config/prod.yaml）：
  # endpoint: https://o2.example.com/api/default
  # headers:
  #   Authorization: Basic <base64(user:password)>
  # browser:
  #   site: https://o2.example.com
  #   client_token: <openobserve-rum-client-token>
  #   organization: default
  #   environment: production

# 本机开发复用共享常驻 PostgreSQL，通过 .env 中的 DATABASE_URL 指定项目或 worktree 的独立数据库。
database:
  dsn: ${DATABASE_URL:-postgres://postgres:postgres@127.0.0.1:5432/agents_desk?sslmode=disable}

# 本机开发复用共享常驻 NATS（开启 JetStream），通过 .env 中的 NATS_URL 覆盖。
nats:
  url: ${NATS_URL:-nats://127.0.0.1:4222}

# 队列 stream 区分共用一套 NATS 的应用与 worktree，可通过 .env 中的 QUEUE_STREAM 覆盖。
queue:
  stream: ${QUEUE_STREAM:-agents_desk_jobs}

# 应用密钥：32 字节随机数的 base64（openssl rand -base64 32），必填：生产环境用环境变量 APP_KEY，本机写在 config/local.yaml。
# 它派生登录验证码的密钥，加密保存聊天插件的身份验证密钥，以后也用于签名链接。
crypt:
  key: ${APP_KEY}

# 平台管理员的登录有效期
admin_token:
  lifetime: 12h
  idle_timeout: 2h
# 坐席每天都在工作区端工作，登录保持得更久：最长 30 天，7 天没有使用就失效。
member_token:
  lifetime: 720h
  idle_timeout: 168h
# 客户在聊天插件中的令牌：浏览器保存它，客户隔很久再来也能看到之前的会话；最长一年，90 天没有使用就失效，之后聊天窗口重新建立会话。
contact_token:
  lifetime: 8760h
  idle_timeout: 2160h

# 上传的文件（头像、会话附件等）。默认存在本地目录 storage/files，由应用在 /storage/ 下提供访问；多台服务器或需要 CDN 时
# 改用 S3：配置 disks.s3，并把 default_disk 改为 s3，见 Tenon 文档的 libraries/filesystem.md。
filesystem:
  default_disk: ${FILES_DISK:-local}
  private_disk: ${FILES_PRIVATE_DISK:-local_private}
  max_upload_size: 50MiB
  disks:
    local:
      root: ${FILES_ROOT:-storage/files}
      public_url: /storage
    local_private:
      root: ${FILES_PRIVATE_ROOT:-storage/private}
      private: true

# 图片缩略图服务（imgproxy）：未配置 url 时（开发环境）缩略图原样返回原图地址；生产环境建议配合 key 和 salt 签名访问。
imgproxy:
  url: ${IMGPROXY_URL:-}
  key: ${IMGPROXY_KEY:-}
  salt: ${IMGPROXY_SALT:-}
