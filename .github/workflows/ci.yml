name: ci

on:
  push:
    branches: [main]
  pull_request:

# 同一 PR 连续推送时自动取消旧的运行，主干提交始终跑完。
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# 两个任务并行：check 是 Go 的检查和测试，以及生成的代码是否已经提交；build 是前端的类型检查和完整的构建。
# go tool tenon 的版本由 go.mod 固定，Bun 的版本由 package.json 的 packageManager 固定，与本地相同。
jobs:
  check:
    runs-on: ubuntu-latest
    env:
      POSTGRES_TEST_URL: postgres://postgres:postgres@127.0.0.1:5432/postgres?sslmode=disable
    steps:
      - uses: actions/checkout@v4

      # 数据库测试用 dbtest 为每个测试建一个临时库。队列经由逻辑复制转发任务，每个测试数据库一个复制槽；
      # 通过 docker run 显式开启 wal_level=logical 并调高复制槽与连接数上限。
      - name: Start PostgreSQL
        run: |
          docker run -d --name postgres -p 5432:5432 -e POSTGRES_PASSWORD=postgres postgres:18 \
            -c wal_level=logical -c max_replication_slots=256 -c max_wal_senders=64 -c max_connections=500
          for i in $(seq 1 60); do docker exec postgres pg_isready -U postgres -h 127.0.0.1 && exit 0; sleep 1; done
          docker logs postgres
          exit 1

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false

      # 显式缓存模块与编译产物，并带前缀回退：依赖升级或新增包时只增量下载变动部分，日常提交复用编译缓存。
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: go-check-${{ runner.os }}-${{ hashFiles('go.mod', 'go.sum') }}-${{ github.sha }}
          restore-keys: |
            go-check-${{ runner.os }}-${{ hashFiles('go.mod', 'go.sum') }}-
            go-check-${{ runner.os }}-
            go-

      # 生成前端的清单（apps/dist，go:embed 需要它）和接口的客户端。客户端提交在仓库中：
      # 改了接口却没有提交重新生成的客户端时，git status 列出有差异或新出现的文件。
      - name: Generate
        run: |
          go tool tenon generate
          git status --porcelain
          test -z "$(git status --porcelain)"

      # 升级框架后没有运行 bun run agents 时，AGENTS.md 约定区块、框架文档或技能与框架版本不一致。
      - name: Agents
        run: |
          go tool tenon agents
          git status --porcelain -- AGENTS.md tenon/docs .claude/skills .agents/skills .github/skills
          test -z "$(git status --porcelain -- AGENTS.md tenon/docs .claude/skills .agents/skills .github/skills)"

      - name: Format
        run: test -z "$(gofmt -l $(go list -f '{{.Dir}}' ./...))"

      - name: Vet
        run: go vet ./...

      # 静态检查项目约定：前端写死的文字和颜色、SQL 数据库时钟、服务端错误码翻译、前端依赖版本。
      - name: Check
        run: go tool tenon check

      # 框架的迁移都已发布，并且与框架一致。
      - name: Migrations
        run: go run ./cmd/agents-desk migrate verify

      - name: Test
        run: go test ./...

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: go-build-${{ runner.os }}-${{ hashFiles('go.mod', 'go.sum') }}-${{ github.sha }}
          restore-keys: |
            go-build-${{ runner.os }}-${{ hashFiles('go.mod', 'go.sum') }}-
            go-build-${{ runner.os }}-
            go-

      - uses: oven-sh/setup-bun@v2

      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      # tenon/js 中的框架前端包随仓库提交，直接安装 workspace 依赖。
      - name: Install
        run: bun install --frozen-lockfile

      # typecheck 重新生成路由树 routeTree.gen.ts：新加了页面却没有提交它时，这里有差异。
      - name: Typecheck
        run: |
          bun run typecheck
          git status --porcelain
          test -z "$(git status --porcelain)"

      - name: Build
        run: bun run build
