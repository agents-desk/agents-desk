# 开发和测试用的基础设施：docker compose up -d --wait
# 端口避开 5432、4222，与本机其他项目的 PostgreSQL、NATS 共存。
name: agents-desk

services:
  postgres:
    image: postgres:18
    # 队列经由逻辑复制转发任务
    command: [postgres, -c, wal_level=logical]
    environment:
      POSTGRES_USER: agents_desk
      POSTGRES_PASSWORD: agents_desk
    ports: ["127.0.0.1:15432:5432"]
    volumes: [postgres:/var/lib/postgresql]
    healthcheck:
      test: pg_isready -U agents_desk -h 127.0.0.1
      interval: 1s
      retries: 60

  nats:
    image: nats:2.15-alpine
    command: [nats-server, -js, -sd, /data]
    ports: ["127.0.0.1:14222:4222"]
    volumes: [nats:/data]

volumes:
  postgres:
  nats:
