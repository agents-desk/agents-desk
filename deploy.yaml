# 原生二进制 + systemd 部署配置：运行 go tool tenon deploy setup 初始化目标机，再运行 go tool tenon deploy 发布
app: helmdesk
# 目标 Linux 架构（amd64、arm64）；留空时通过 SSH 自动探测
keep_releases: 5

environments:
  production:
    user: ubuntu                # SSH 登录用户（需具备 sudo 权限）
    service_user: helmdesk      # 运行应用的 Linux 系统用户
    dir: /opt/helmdesk          # 远端部署目录
    env_file: /etc/helmdesk/env # 远端环境变量文件（600 权限，不进仓库）
    config_files:
      - config/prod.yaml
    hosts:
      - 18.138.87.23
