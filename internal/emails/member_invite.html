{{define "content"}}
<h2 style="margin-top: 0; font-size: 18px;">{{t "mail.member_invite.title" .}}</h2>
<p>{{t "mail.member_invite.intro" .}}</p>
{{if .RoleName}}<p style="font-size: 14px;">{{t "mail.member_invite.role" .}}</p>{{end}}
<p style="margin: 22px 0;">
  <a href="{{.LoginURL}}" style="display: inline-block; padding: 10px 18px; background-color: #111827; color: #ffffff; text-decoration: none; border-radius: 6px; font-weight: 600;">{{t "mail.member_invite.cta" .}}</a>
</p>
<p style="color: #6b7280; font-size: 13px;">{{t "mail.member_invite.password_hint" .}}</p>
{{end}}
{{template "_layout.html" .}}
